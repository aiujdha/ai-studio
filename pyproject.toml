[project]
name = "ai-studio"
version = "0.2.0"
description = "Local creation tasks, tools, assets and quota workflow"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_studio = ["index.html"]
