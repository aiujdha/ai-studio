<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Studio</title>
<style>body{font:16px system-ui;background:#f3f5f9;color:#2a3447;margin:0}main{max-width:1100px;margin:40px auto;padding:0 20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{padding:23px;background:white;border:1px solid #dce3ef;border-radius:12px;margin:20px 0}textarea{width:100%;box-sizing:border-box;min-height:100px;border:1px solid #c1cce0;padding:12px;font:inherit;border-radius:8px}button{background:#63489c;color:white;border:0;padding:10px 16px;border-radius:8px;cursor:pointer;margin:12px 8px 0 0}select{padding:8px;margin-bottom:14px;max-width:100%;font:inherit}p,small{color:#738197}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}.run{padding:12px 0;border-bottom:1px solid #edf0f5;cursor:pointer}.run b{font-size:14px}img{width:100%;border-radius:8px;margin:14px 0}#error{color:#b53838}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style>
<main><h1>AI Studio</h1><p>创作任务 · 工具执行 · 素材与额度</p><div class="card"><label>本地身份 <select id="user"><option value="local-member-key">普通用户</option><option value="local-admin-key">管理员 / 专业用户</option></select></label><p id="credits"></p><small>身份选择仅用于本机功能体验，不是正式登录系统。</small></div><div class="grid"><section><div class="card"><h2>创建任务</h2><select id="target"></select><textarea id="prompt" maxlength="500">春日新品创作卡片</textarea><button id="submit">提交任务</button><p>本地图像适配器绘制固定布局 SVG 卡片，不调用生图或视频模型。</p><p id="error" role="alert"></p></div><div class="card"><h2>任务列表</h2><div id="runs"></div></div></section><section class="card"><h2>执行详情</h2><p id="state">选择或提交一个任务</p><button id="cancel" hidden>取消任务</button><pre id="detail"></pre><img id="asset" hidden alt="任务生成的本地卡片"><a id="download" hidden>下载素材</a></section></div></main>
<script>
const $=id=>document.getElementById(id);let current=null,assetID=null,assetURL=null,refreshing=false,epoch=0;
async function api(path,options={},key=$('user').value){const response=await fetch(path,{...options,headers:{Authorization:'Bearer '+key,'Content-Type':'application/json',...options.headers}});const data=await response.json();if(!response.ok)throw Error(data.error);return data}
function clearAsset(){if(assetURL)URL.revokeObjectURL(assetURL);assetURL=null;assetID=null;$('asset').hidden=true;$('download').hidden=true}
async function refresh(){if(refreshing)return;refreshing=true;const version=epoch,key=$('user').value;try{const [profile,data]=await Promise.all([api('/api/profile',{},key),api('/api/runs',{},key)]);if(version!==epoch)return;const c=profile.credits;$('credits').textContent=`${profile.user_id} · 可用 ${c.available} / 预占 ${c.reserved} / 已消耗 ${c.spent}`;$('runs').replaceChildren();for(const run of data.runs){const row=document.createElement('div');row.className='run';const title=document.createElement('b');title.textContent=`${run.target} · ${run.state}`;const text=document.createElement('p');text.textContent=run.prompt;row.append(title,text);row.onclick=()=>{current=run.id;clearAsset();refresh()};$('runs').append(row)}const run=data.runs.find(item=>item.id===current);if(run){$('state').textContent=`${run.id} · ${run.state}`;$('cancel').hidden=!['queued','running'].includes(run.state);$('detail').textContent=JSON.stringify({events:run.events,result:run.result,error:run.error},null,2);if(run.asset_id&&run.asset_id!==assetID){const response=await fetch('/api/assets/'+run.asset_id,{headers:{Authorization:'Bearer '+key}});if(!response.ok)throw Error('素材读取失败');const blob=await response.blob();if(version!==epoch||current!==run.id)return;clearAsset();assetID=run.asset_id;assetURL=URL.createObjectURL(blob);$('asset').src=assetURL;$('asset').hidden=false;$('download').href=assetURL;$('download').download='studio-card.svg';$('download').hidden=false}}}catch(error){if(version===epoch)$('error').textContent=error.message}finally{refreshing=false}}
async function catalog(){const version=epoch,data=await api('/api/catalog');if(version!==epoch)return;$('target').replaceChildren();for(const m of data.models){const option=document.createElement('option');option.value='image:'+m.id;option.textContent='图像 · '+m.name;$('target').append(option)}for(const t of data.tools){const option=document.createElement('option');option.value='tool:'+t.name;option.textContent='工具 · '+t.description;$('target').append(option)}}
$('submit').onclick=async()=>{$('submit').disabled=true;$('error').textContent='';const version=epoch;try{const [kind,target]=$('target').value.split(':');const run=await api('/api/runs',{method:'POST',body:JSON.stringify({kind,target,prompt:$('prompt').value})});if(version!==epoch)return;current=run.id;clearAsset();await refresh()}catch(error){$('error').textContent=error.message}finally{$('submit').disabled=false}};
$('cancel').onclick=async()=>{try{await api('/api/runs/'+current+'/cancel',{method:'POST'});await refresh()}catch(error){$('error').textContent=error.message}};
$('user').onchange=async()=>{epoch++;current=null;clearAsset();$('state').textContent='选择或提交一个任务';$('detail').textContent='';$('cancel').hidden=true;$('error').textContent='';$('runs').replaceChildren();try{await catalog();await refresh()}catch(error){$('error').textContent=error.message}};
catalog().then(refresh).catch(error=>$('error').textContent=error.message);setInterval(refresh,700);
</script></html>
